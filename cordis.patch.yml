# Bundle patch for dsh-aiterm (formerly @dsh/aiterm, and @dsh/dsh-ssh-telnet before that).
# One row loads the package main entry as the host half; the `dsh.client`
# declaration in package.json makes the Web app load ./lib/client.js as the
# browser half.
- insert:
    - id: aiterm
      name: 'dsh-aiterm'
      config:
        aiAccessDefault: rw
        aiAutoLock: true
        aiLockIdleMs: 30000
        blockHumanWhileAi: true
        humanCanPreempt: true
        maxSessions: 16
        scrollback: 4000
        routePath: /aiterm
        enabled: true
